<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Study Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#14171c;--line:#242a33;--text:#e6e9ee;--mute:#8a93a1;--gold:#e8b84a;--win:#2fc76a;--loss:#e5484d;--be:#6b7686;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}
.side{width:210px;background:#0a0c0f;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-weight:700}
.logo b{background:var(--gold);color:#1a1405;border-radius:7px;padding:4px 7px;font-size:13px}
.nav{background:none;border:0;color:var(--mute);text-align:left;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
.nav:hover{color:var(--text)}
.nav.on{background:var(--gold);color:#1a1405;font-weight:700}
.sp{flex:1}
.mini{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap}
main{flex:1;padding:26px 30px;max-width:980px}
h1{margin:0;font-size:24px}
.sub{color:var(--mute);margin:2px 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
button{font:inherit}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.btn.sm{padding:4px 10px;font-size:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card small{color:var(--mute)}
.card .v{font-size:24px;font-weight:700;margin-top:2px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.filters input,.filters select{width:auto}
textarea{min-height:70px;resize:vertical}
.entry{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--be);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.entry.win{border-left-color:var(--win)}.entry.loss{border-left-color:var(--loss)}
.eh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.eh h3{margin:0;font-size:16px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;color:var(--mute)}
.tag.bad{border-color:#5a2528;color:#f0898c}
.tag.up{color:var(--win);border-color:#1d4d31}.tag.down{color:var(--loss);border-color:#5a2528}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.blk h4{margin:0 0 2px;font-size:12px;color:var(--gold);font-weight:500}
.blk p{margin:0;white-space:pre-wrap;color:#cfd4dc}
.empty{text-align:center;color:var(--mute);padding:50px 10px;border:1px dashed var(--line);border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:5}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:720px}
.sheet h2{margin:0 0 4px}
.sec{color:var(--gold);font-size:13px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#0f1216;color:var(--mute);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:12px}
.chip.on{background:#3a1c1e;border-color:var(--loss);color:#f0898c}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{color:var(--mute);font-size:12px;text-align:center}
.day{min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:left;color:var(--text);cursor:pointer}
.day.off{opacity:.35;cursor:default}
.day.win{border-color:var(--win);background:#112419}.day.loss{border-color:var(--loss);background:#2a1315}.day.be{border-color:var(--be)}
.day b{font-size:12px}.day span{display:block;font-size:11px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar i{display:block;height:10px;background:var(--loss);border-radius:5px}
.bar em{min-width:130px;font-style:normal;color:var(--mute)}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.sp,.mini{display:none}main{padding:18px 14px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><b>XAU</b><span>Gold Study Journal</span></div>
    <button class="nav on" data-v="journal">Journal</button>
    <button class="nav" data-v="calendar">Calendar</button>
    <button class="nav" data-v="insights">Insights</button>
    <div class="sp"></div>
    <div class="mini"><button class="btn sm" id="exJ">↓ JSON</button><button class="btn sm" id="exC">↓ CSV</button><button class="btn sm" id="imp">↑ Import</button></div>
    <input type="file" id="file" accept=".json" hidden>
  </aside>
  <main>
    <div class="top"><div><h1 id="title">Journal</h1><p class="sub" id="sub"></p></div><button class="btn pri" id="add">+ Log a day</button></div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="mt">Log a trading day</h2>
  <div class="sec">1. What gold did</div>
  <div class="row">
    <div><label>Date</label><input type="date" id="date"></div>
    <div><label>Direction</label><select id="dir"><option>Bullish</option><option>Bearish</option><option>Ranging</option></select></div>
    <div><label>Open</label><input type="number" step="0.01" id="o"></div>
    <div><label>High</label><input type="number" step="0.01" id="h"></div>
    <div><label>Low</label><input type="number" step="0.01" id="l"></div>
    <div><label>Close</label><input type="number" step="0.01" id="c"></div>
  </div>
  <label>How did price move? (Asia, London, New York, key levels, FVGs, sweeps)</label><textarea id="mkt"></textarea>
  <label>News and drivers (USD data, yields, geopolitics)</label><textarea id="news"></textarea>
  <div class="sec">2. What I did</div>
  <div class="row">
    <div><label>Result</label><select id="res"><option>Win</option><option>Loss</option><option>Breakeven</option><option>No trade</option></select></div>
    <div><label>P&amp;L ($)</label><input type="number" step="0.01" id="pnl"></div>
    <div><label>Did I follow my plan?</label><select id="plan"><option>Yes</option><option>Partly</option><option>No</option></select></div>
    <div><label>Was my analysis correct?</label><select id="ana"><option>Yes</option><option>Partly</option><option>No</option></select></div>
  </div>
  <label>My bias and trade (entry, stop, target, reasoning)</label><textarea id="did"></textarea>
  <div class="sec">3. Review</div>
  <label>What went well</label><textarea id="well"></textarea>
  <label>What failed</label><textarea id="fail"></textarea>
  <label>Mistakes I made</label><div class="chips" id="chips"></div>
  <label>What I did wrong, in my own words</label><textarea id="wrong"></textarea>
  <label>What I will do differently</label><textarea id="diff"></textarea>
  <label>One lesson for tomorrow</label><input id="lesson">
  <div class="row"><div><label>Discipline score (1 to 5)</label><select id="disc"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div><div><label>Chart link (optional)</label><input id="link" placeholder="TradingView URL"></div></div>
  <div class="acts"><button class="btn" id="del" style="margin-right:auto;color:var(--loss)">Delete</button><button class="btn" id="cancel">Cancel</button><button class="btn pri" id="save">Save day</button></div>
</div></div>

<script>
const KEY='goldStudyJournal.v1';
const MISTAKES=['FOMO entry','Entered early','Moved stop loss','Over-traded','Ignored my plan','Traded the news','Revenge trade','Oversized lot','Exited too early','Held too long','Wrong bias','No mistake'];
let data=[],view='journal',editing=null,calMonth=new Date(),picked=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save. Browser storage may be blocked.')}};
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const money=n=>(n>0?'+':n<0?'-':'')+'$'+Math.abs(n||0).toFixed(2);
const cls=r=>r==='Win'?'win':r==='Loss'?'loss':'be';
const range=e=>(e.h&&e.l)?Math.round((e.h-e.l)*10)/10:null;

$('chips').innerHTML=MISTAKES.map(m=>`<button type="button" class="chip" data-m="${m}">${m}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;b.classList.toggle('on')};

const F=['date','dir','o','h','l','c','mkt','news','res','pnl','plan','ana','did','well','fail','wrong','diff','lesson','disc','link'];
function openForm(date){
  editing=date&&data.find(x=>x.date===date)||null;
  $('mt').textContent=editing?'Edit '+fmtDate(editing.date):'Log a trading day';
  F.forEach(k=>{$(k).value=editing?(editing[k]??''):''});
  if(!editing){$('date').value=new Date().toISOString().slice(0,10);$('dir').value='Bullish';$('res').value='Win';$('plan').value='Yes';$('ana').value='Yes';$('disc').value='4'}
  const on=editing?editing.mistakes||[]:[];
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',on.includes(c.dataset.m)));
  $('del').style.display=editing?'':'none';
  $('modal').classList.add('open');
}
function closeForm(){$('modal').classList.remove('open')}
$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;
$('modal').onclick=e=>{if(e.target.id==='modal')closeForm()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
$('save').onclick=()=>{
  const r={};F.forEach(k=>r[k]=$(k).value.trim());
  if(!r.date){alert('Pick a date first.');return}
  ['o','h','l','c','pnl'].forEach(k=>r[k]=r[k]===''?null:parseFloat(r[k]));
  r.disc=parseInt(r.disc);
  r.mistakes=[...document.querySelectorAll('.chip.on')].map(c=>c.dataset.m);
  const dupe=data.find(x=>x.date===r.date&&(!editing||x.date!==editing.date));
  if(dupe&&!confirm('You already logged this date. Replace it?'))return;
  data=data.filter(x=>x.date!==r.date&&(!editing||x.date!==editing.date));
  data.push(r);data.sort((a,b)=>b.date.localeCompare(a.date));
  persist();closeForm();render();
};
$('del').onclick=()=>{if(confirm('Delete this day for good?')){data=data.filter(x=>x.date!==editing.date);persist();closeForm();render()}};

function block(t,v){return v?`<div class="blk"><h4>${t}</h4><p>${esc(v)}</p></div>`:''}
function entryHTML(e){
  const r=range(e);
  return `<div class="entry ${cls(e.res)}">
  <div class="eh"><h3>${fmtDate(e.date)}</h3><div><span class="tag ${e.dir==='Bullish'?'up':e.dir==='Bearish'?'down':''}">${e.dir}</span><span class="tag">${e.res} ${e.pnl!=null?money(e.pnl):''}</span><button class="btn sm" data-edit="${e.date}">Edit</button></div></div>
  <div style="color:var(--mute);margin:4px 0">${e.o!=null?`O ${e.o} · H ${e.h} · L ${e.l} · C ${e.c}`:''}${r?` · Range ${r}`:''}</div>
  <div><span class="tag">Plan followed: ${e.plan}</span><span class="tag">Analysis correct: ${e.ana}</span><span class="tag">Discipline ${e.disc}/5</span>${(e.mistakes||[]).map(m=>`<span class="tag ${m==='No mistake'?'':'bad'}">${esc(m)}</span>`).join('')}</div>
  <div class="grid2">${block('What gold did',e.mkt)}${block('News and drivers',e.news)}${block('What I did',e.did)}${block('What went well',e.well)}${block('What failed',e.fail)}${block('What I did wrong',e.wrong)}${block('What I will do differently',e.diff)}${block('Lesson for tomorrow',e.lesson)}</div>
  ${e.link?`<p style="margin:8px 0 0"><a style="color:var(--blue)" href="${esc(e.link)}" target="_blank" rel="noopener">Open chart</a></p>`:''}
  </div>`;
}

function renderJournal(){
  const q=$('q')?$('q').value.toLowerCase():'',f=$('fr')?$('fr').value:'';
  const list=data.filter(e=>(!f||e.res===f)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));
  $('view').innerHTML=`<div class="filters"><input id="q" placeholder="Search notes, mistakes, lessons" value="${esc(q)}" style="min-width:240px"><select id="fr"><option value="">All results</option>${['Win','Loss','Breakeven','No trade'].map(x=>`<option ${x===f?'selected':''}>${x}</option>`).join('')}</select></div>`+
  (list.length?list.map(entryHTML).join(''):`<div class="empty">${data.length?'No days match that search.':'No days logged yet. After the New York close, press “Log a day” and write down what gold did.'}</div>`);
  $('q').oninput=renderJournal;$('fr').onchange=renderJournal;
  if(q)$('q').focus(),$('q').setSelectionRange(q.length,q.length);
}

function renderCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),pad=(first.getDay()+6)%7;
  let h=`<div class="filters"><button class="btn" id="pm">‹ Prev</button><b style="padding:8px">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="btn" id="nm">Next ›</button></div><div class="cal">`+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('');
  for(let i=0;i<pad;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=data.find(x=>x.date===ds),wk=[0,6].includes(new Date(y,m,d).getDay());
    h+=`<button class="day ${e?cls(e.res):''} ${wk?'off':''}" ${wk?'disabled':''} data-d="${ds}"><b>${d}</b>${e?`<span>${e.dir}</span><span>${e.pnl!=null?money(e.pnl):e.res}</span>`:''}</button>`;
  }
  $('view').innerHTML=h+'</div>';
  $('pm').onclick=()=>{calMonth=new Date(y,m-1,1);renderCalendar()};
  $('nm').onclick=()=>{calMonth=new Date(y,m+1,1);renderCalendar()};
}

function renderInsights(){
  if(!data.length){$('view').innerHTML='<div class="empty">Log a few days and your patterns will show up here.</div>';return}
  const n=data.length,traded=data.filter(e=>e.res!=='No trade'),w=data.filter(e=>e.res==='Win').length,l=data.filter(e=>e.res==='Loss').length;
  const pnl=data.reduce((s,e)=>s+(e.pnl||0),0),disc=(data.reduce((s,e)=>s+(e.disc||0),0)/n).toFixed(1);
  const rights=data.filter(e=>e.ana==='Yes').length,follow=data.filter(e=>e.plan==='Yes').length;
  const wf=data.filter(e=>e.plan==='Yes'&&e.res!=='No trade'),nf=data.filter(e=>e.plan!=='Yes'&&e.res!=='No trade');
  const wr=a=>a.length?Math.round(a.filter(e=>e.res==='Win').length/a.length*100)+'%':'-';
  const cnt={};data.forEach(e=>(e.mistakes||[]).forEach(m=>{if(m!=='No mistake')cnt[m]=(cnt[m]||0)+1}));
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  const lessons=data.filter(e=>e.lesson).slice(0,6);
  $('view').innerHTML=`<div class="cards">
  <div class="card"><small>Days logged</small><div class="v">${n}</div></div>
  <div class="card"><small>Win rate (traded days)</small><div class="v">${traded.length?Math.round(w/traded.length*100)+'%':'-'}</div></div>
  <div class="card"><small>Wins / Losses</small><div class="v"><span style="color:var(--win)">${w}</span> / <span style="color:var(--loss)">${l}</span></div></div>
  <div class="card"><small>Total P&amp;L</small><div class="v" style="color:${pnl>=0?'var(--win)':'var(--loss)'}">${money(pnl)}</div></div>
  <div class="card"><small>Analysis correct</small><div class="v">${Math.round(rights/n*100)}%</div></div>
  <div class="card"><small>Plan followed</small><div class="v">${Math.round(follow/n*100)}%</div></div>
  <div class="card"><small>Avg discipline</small><div class="v">${disc}/5</div></div></div>
  <div class="card" style="margin-bottom:14px"><small>Win rate when I followed my plan vs when I did not</small><div class="v">${wr(wf)} <span style="color:var(--mute);font-size:14px">vs</span> ${wr(nf)}</div></div>
  <div class="card" style="margin-bottom:14px"><b>Mistakes that cost me most often</b>${rows.length?rows.map(([k,v])=>`<div class="bar"><em>${esc(k)}</em><i style="width:${v/max*55}%"></i><span>${v}</span></div>`).join(''):'<p style="color:var(--mute)">No mistakes tagged yet.</p>'}</div>
  <div class="card"><b>Latest lessons</b>${lessons.length?lessons.map(e=>`<p style="margin:8px 0"><span style="color:var(--mute)">${fmtDate(e.date)}</span><br>${esc(e.lesson)}</p>`).join(''):'<p style="color:var(--mute)">Add a one-line lesson to each day.</p>'}</div>`;
}

const T={journal:['Journal','Every trading day, reviewed.'],calendar:['Calendar','Green is a win, red is a loss, grey is breakeven or no trade.'],insights:['Insights','What your own records say about you.']};
function render(){
  $('title').textContent=T[view][0];$('sub').textContent=T[view][1];
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({journal:renderJournal,calendar:renderCalendar,insights:renderInsights})[view]();
}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('view').onclick=e=>{
  const ed=e.target.closest('[data-edit]'),dy=e.target.closest('.day[data-d]');
  if(ed)openForm(ed.dataset.edit);
  else if(dy)openForm(data.find(x=>x.date===dy.dataset.d)?dy.dataset.d:null),!data.find(x=>x.date===dy.dataset.d)&&($('date').value=dy.dataset.d);
};

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('exJ').onclick=()=>dl('gold-journal-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');
$('exC').onclick=()=>{
  const cols=['date','dir','o','h','l','c','res','pnl','plan','ana','disc','mistakes','mkt','news','did','well','fail','wrong','diff','lesson','link'];
  const q=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';
  dl('gold-journal.csv',[cols.join(',')].concat(data.map(e=>cols.map(c=>q(e[c])).join(','))).join('\n'),'text/csv');
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;
    if(!confirm('Merge '+arr.length+' days into your journal? Matching dates will be overwritten.'))return;
    const map=new Map(data.map(x=>[x.date,x]));arr.forEach(x=>x.date&&map.set(x.date,x));
    data=[...map.values()].sort((a,b)=>b.date.localeCompare(a.date));persist();render()}catch(err){alert('That file is not a valid journal backup.')}};
  r.readAsText(f);e.target.value='';
};
render();
</script>
</body>
</html>
